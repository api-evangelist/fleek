name: Fleek
description: 'Fleek is a B2B wholesale marketplace for vintage and secondhand clothing that connects
  resellers with a global network of verified suppliers, letting new resellers, full-time resellers,
  and retail businesses source pre-owned inventory in bulk at wholesale margins. The platform aggregates
  more than a thousand secondhand suppliers worldwide, handles discovery, ordering, and logistics through
  its website and mobile apps, and is backed by HV Capital. Fleek operates a consumer/reseller storefront
  (built on Shopify) and a separate vendor onboarding flow for suppliers; it does not currently publish
  a public developer API, SDKs, or API documentation. This profile was surfaced from the HV Capital
  portfolio and enriched from Fleek''s public web surface.'
